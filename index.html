<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週末盲盒行程產生器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #7f8c8d;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: #3498db;
        }
        .btn-draw {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d32f2f;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
            margin-top: 10px;
        }
        .btn-draw:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 154, 158, 0.4);
        }
        .result-card {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #3498db;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }
        .destination-name {
            font-size: 22px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
        }
        
        .spots-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .spot-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border: 1px solid #ecf0f1;
        }
        .spot-name {
            padding: 10px 15px;
            font-weight: bold;
            color: #2c3e50;
            background-color: #fcfcfc;
            border-bottom: 1px solid #f1f1f1;
        }
        .spot-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .maps-btn {
            display: inline-block;
            background-color: #4285F4;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            width: calc(100% - 40px);
            box-sizing: border-box;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 週末盲盒行程產生器</h1>
    
    <div class="input-group">
        <label for="budget">預算考量 (單人)</label>
        <select id="budget">
            <option value="low">銅板小資 ($500內)</option>
            <option value="medium">剛剛好就好 ($500 - $1500)</option>
            <option value="high">週末放鬆 ($1500以上)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="commute">預期通勤時間 (單程)</label>
        <select id="commute">
            <option value="short">就在附近 (30分鐘內)</option>
            <option value="medium">出去走走 (30 - 60分鐘)</option>
            <option value="long">遠離塵囂 (1小時以上)</option>
        </select>
    </div>

    <button class="btn-draw" onclick="drawBlindBox()">抽籤出發！</button>

    <div class="result-card" id="resultCard">
        <div class="destination-name" id="destName">目的地名稱</div>
        <p><strong>✨ 必去景點：</strong></p>
        <ul class="spots-list" id="spotsList">
            </ul>
        <a href="#" class="maps-btn" id="mapsLink" target="_blank">🗺️ 開啟 Google Maps 導航</a>
    </div>
</div>

<script>
    const destinations = [
        { 
            name: "鹽埕埔老街區", budget: "low", commute: "short", 
            spots: [
                { name: "駁二藝術特區", img: "駁二.jpg" },
                { name: "大港橋", img: "大港橋.jpeg" },
                { name: "新樂街奶茶一條街", img: "奶茶一條街.jpg" }
            ] 
        },
        { 
            name: "旗津海岸公園", budget: "low", commute: "short", 
            spots: [
                { name: "旗后燈塔", img: "旗後燈塔.jpg" },
                { name: "星空隧道", img: "星空隧道.jpeg" },
                { name: "旗津老街吃海鮮", img: "旗津老街海鮮.jpg" }
            ] 
        },
        { 
            name: "左營蓮池潭", budget: "low", commute: "medium", 
            spots: [
                { name: "龍虎塔", img: "龍虎塔.jpg" },
                { name: "春秋閣", img: "春秋閣.jpeg" },
                { name: "果貿社區", img: "果貿社區.jpg" }
            ] 
        },
        { 
            name: "台南中西區", budget: "medium", commute: "medium", 
            spots: [
                { name: "國華街美食", img: "國華街.jpg" },
                { name: "台南美術館二館", img: "美術館二館-3.jpg" },
                { name: "林百貨", img: "林百貨.webp" }
            ] 
        },
        { 
            name: "屏東勝利星村", budget: "medium", commute: "medium", 
            spots: [
                { name: "勝利星村創意生活園區", img: "勝利星村創意生活園區.jpg" },
                { name: "屏東縣民公園", img: "縣民公園.avif" },
                { name: "屏東夜市", img: "屏東夜市.webp" }
            ] 
        },
        { 
            name: "高雄巨蛋/瑞豐商圈", budget: "medium", commute: "short", 
            spots: [
                { name: "瑞豐夜市", img: "瑞豐夜市.jpeg" },
                { name: "漢神巨蛋購物廣場", img: "漢神巨蛋.jpg" },
                { name: "凹子底森林公園", img: "凹子底.jpg" }
            ] 
        },
        { 
            name: "台南安平區", budget: "medium", commute: "long", 
            spots: [
                { name: "安平古堡", img: "安平古堡.jpg" },
                { name: "漁光島", img: "漁光島.jpg" },
                { name: "安平樹屋", img: "安平樹屋.jpg" }
            ] 
        },
        { 
            name: "屏東墾丁", budget: "high", commute: "long", 
            spots: [
                { name: "南灣遊憩區", img: "南灣.jpg" },
                { name: "鵝鑾鼻燈塔", img: "鵝鑾鼻燈塔.jpg" },
                { name: "墾丁大街", img: "墾丁大街.jpg" }
            ] 
        },
        { 
            name: "小琉球", budget: "high", commute: "long", 
            spots: [
                { name: "花瓶岩", img: "花瓶岩.jpg" },
                { name: "落日亭", img: "落日亭.png" },
                { name: "龍蝦洞", img: "龍蝦洞.jpg" }
            ] 
        },
        { 
            name: "高雄義大世界", budget: "high", commute: "medium", 
            spots: [
                { name: "義大遊樂世界", img: "義大.jpg" },
                { name: "義大購物中心", img: "義大購物.webp" },
                { name: "摩天輪觀景", img: "摩天輪.jpg" }
            ] 
        }
    ];

    function drawBlindBox() {
        const selectedBudget = document.getElementById('budget').value;
        const selectedCommute = document.getElementById('commute').value;
        
        const filtered = destinations.filter(d => 
            d.budget === selectedBudget && d.commute === selectedCommute
        );

        const resultCard = document.getElementById('resultCard');

        if (filtered.length === 0) {
            const surprise = destinations[Math.floor(Math.random() * destinations.length)];
            displayResult(surprise, true);
        } else {
            const result = filtered[Math.floor(Math.random() * filtered.length)];
            displayResult(result, false);
        }
    }

    function displayResult(data, isSurprise) {
        const destName = document.getElementById('destName');
        const spotsList = document.getElementById('spotsList');
        const mapsLink = document.getElementById('mapsLink');
        const resultCard = document.getElementById('resultCard');

        destName.innerText = (isSurprise ? "🎲 驚喜推薦：" : "🎉 你的目的地是：") + data.name;
        
        // 清空舊的景點清單
        spotsList.innerHTML = '';
        
        // 動態生成包含圖片與名稱的 HTML 結構
        data.spots.forEach(spot => {
            const li = document.createElement('li');
            li.className = 'spot-item'; 
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'spot-name';
            nameDiv.innerText = '📍 ' + spot.name;
            
            const img = document.createElement('img');
            img.className = 'spot-img';
            img.src = spot.img; 
            img.alt = spot.name;
            
            li.appendChild(nameDiv);
            li.appendChild(img);
            spotsList.appendChild(li);
        });

        // 生成正式的 Google Maps 導航連結 (使用官方標準格式)
        const origin = encodeURIComponent("國立中山大學");
        
        // 重點修改區：將目的地改為第一個景點 (data.spots[0].name)
        const destination = encodeURIComponent(data.spots[0].name); 
        
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
        mapsLink.href = gmapsUrl;

        resultCard.style.display = 'block';
    }
</script>

</body>
</html>
